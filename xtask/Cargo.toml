[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "Repository tasks: generates and validates deploy/grafana-dashboard.json"

[dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# The metric catalogue (names, kinds, labels) is read straight from the proxy.
jellyfin-merge-proxy = { path = ".." }
