name: Release

on:
  push:
    tags:
      - 'release/v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Extract and validate version
        id: version
        run: |
          # Extract version from tag
          TAG="${GITHUB_REF#refs/tags/release/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          
          # Check if prerelease
          if echo "$TAG" | grep -qE '\-(rc|alpha|beta)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Validate against Cargo.toml
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          
          echo "Release version: $TAG (prerelease: ${is_prerelease:-false})"

  checks:
    name: Pre-release Checks
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore cache
        uses: Swatinem/rust-cache@v2.7.7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: [validate, checks]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="jellyfin-merge-proxy-${VERSION}-${TARGET}.tar.gz"
          
          mkdir -p dist
          cd target/$TARGET/release
          tar czf ../../../dist/$ARCHIVE \
            jellyfin-merge-proxy \
            ../../../README.md \
            ../../../config.example.toml
          
          cd ../../../dist
          sha256sum $ARCHIVE > $ARCHIVE.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.5.0
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  build-packages:
    name: Build Package (${{ matrix.format }}-${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [validate, checks]
    strategy:
      matrix:
        include:
          - format: deb
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - format: deb
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - format: rpm
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - format: rpm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Build .deb package
        if: matrix.format == 'deb'
        run: |
          cargo deb --no-build --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb dist/

      - name: Build .rpm package
        if: matrix.format == 'rpm'
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/

      - name: Generate checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.5.0
        with:
          name: package-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: [validate, checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/jellyfin-merge-proxy
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Jellyfin Merge Proxy
            org.opencontainers.image.description=HTTP proxy that merges several Jellyfin servers into one virtual server
            org.opencontainers.image.vendor=Jellyfin Merge Proxy Contributors

      - name: Build and push
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [validate, build-binaries, build-packages, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: '{binary-*,package-*}'
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD"
            else
              git log --pretty=format:"- %s (%h)" HEAD
            fi
            echo ""
            echo ""
            echo "## Installation"
            echo ""
            echo "### Docker"
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/jellyfin-merge-proxy:${VERSION}"
            echo '```'
            echo ""
            echo "### Debian/Ubuntu"
            echo '```bash'
            echo "wget https://github.com/${{ github.repository }}/releases/download/release/v${VERSION}/jellyfin-merge-proxy_${VERSION}-1_amd64.deb"
            echo "sudo dpkg -i jellyfin-merge-proxy_${VERSION}-1_amd64.deb"
            echo '```'
            echo ""
            echo "### RHEL/Fedora"
            echo '```bash'
            echo "wget https://github.com/${{ github.repository }}/releases/download/release/v${VERSION}/jellyfin-merge-proxy-${VERSION}-1.x86_64.rpm"
            echo "sudo rpm -i jellyfin-merge-proxy-${VERSION}-1.x86_64.rpm"
            echo '```'
            echo ""
            echo "### Binary"
            echo "Download the appropriate tarball for your architecture from the assets below."
          } > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: v${{ needs.validate.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
