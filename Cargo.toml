[package]
name = "jellyfin-merge-proxy"
version = "0.1.0"
edition = "2021"
description = "HTTP proxy that merges several Jellyfin servers into one virtual Jellyfin server"
license = "MIT"

[lib]
name = "jmp"
path = "src/lib.rs"

[[bin]]
name = "jellyfin-merge-proxy"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }
url = "2"
zeroize = "1"

# HTTP
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }

# Security
argon2 = "0.5"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
metrics-process = "2"

# Parsing
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[build-dependencies]
# For generating packages
cargo-deb = { version = "2", optional = true }
cargo-generate-rpm = { version = "0.15", optional = true }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# argon2 is painfully slow unoptimised; keep debug builds/tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Debian package metadata
[package.metadata.deb]
maintainer = "Jellyfin Merge Proxy Contributors"
copyright = "2024, Jellyfin Merge Proxy Contributors"
license-file = "LICENSE"
extended-description = """\
HTTP proxy that merges several Jellyfin servers into one virtual Jellyfin server. \
Supports hot-reloading, catalog caching, transparent id mapping, and more."""
depends = "$auto, systemd"
section = "net"
priority = "optional"
assets = [
    ["target/release/jellyfin-merge-proxy", "/usr/bin/", "755"],
    ["config.example.toml", "/etc/jmp.toml", "640"],
    ["README.md", "/usr/share/doc/jellyfin-merge-proxy/README.md", "644"],
    ["jellyfin-merge-proxy.service", "/usr/lib/systemd/system/", "644"],
]
conf-files = ["/etc/jmp.toml"]
maintainer-scripts = "debian/"

# RPM package metadata
[package.metadata.generate-rpm]
auto-req = "no"
post_install_script = """
# Create jmp system user if it doesn't exist
if ! id jmp >/dev/null 2>&1; then
    useradd --system --home-dir /var/lib/jmp --no-create-home \
            --shell /usr/sbin/nologin --comment "Jellyfin Merge Proxy" jmp
fi

# Ensure data directory exists with correct ownership
mkdir -p /var/lib/jmp
chown jmp:jmp /var/lib/jmp
chmod 700 /var/lib/jmp

# Ensure config file is writable by jmp user (for secret rewriting)
# Set to jmp:jmp with 640 so jmp can write, root can read
if [ -f /etc/jmp.toml ]; then
    chown jmp:jmp /etc/jmp.toml
    chmod 640 /etc/jmp.toml
fi

# Reload systemd
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload || true
fi
"""
pre_uninstall_script = """
# Stop and disable service
if [ -d /run/systemd/system ]; then
    systemctl stop jellyfin-merge-proxy.service || true
    systemctl disable jellyfin-merge-proxy.service || true
fi
"""
post_uninstall_script = """
# Reload systemd
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload || true
fi

# On complete removal (not upgrade), remove user and data
if [ "$1" = "0" ]; then
    if id jmp >/dev/null 2>&1; then
        userdel jmp || true
    fi
    rm -rf /var/lib/jmp || true
fi
"""
assets = [
    { source = "target/release/jellyfin-merge-proxy", dest = "/usr/bin/jellyfin-merge-proxy", mode = "755" },
    { source = "config.example.toml", dest = "/etc/jmp.toml", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/jellyfin-merge-proxy/README.md", mode = "644" },
    { source = "jellyfin-merge-proxy.service", dest = "/usr/lib/systemd/system/jellyfin-merge-proxy.service", mode = "644" },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
