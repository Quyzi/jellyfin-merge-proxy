[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "jellyfin-merge-proxy"
version = "0.1.0"
edition = "2021"
description = "HTTP proxy that merges several Jellyfin servers into one virtual Jellyfin server"
license = "MIT"

[lib]
name = "jmp"
path = "src/lib.rs"

[[bin]]
name = "jellyfin-merge-proxy"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
percent-encoding = "2"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }
url = "2"
zeroize = "1"

# HTTP
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }

# Security
argon2 = "0.6"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2"
unicode-normalization = "0.1"

# Parsing
x509-parser = "0.18"
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# argon2 is painfully slow unoptimised; keep debug builds/tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Debian package metadata
[package.metadata.deb]
maintainer = "Jellyfin Merge Proxy Contributors"
copyright = "2024, Jellyfin Merge Proxy Contributors"
license-file = "LICENSE"
extended-description = """\
HTTP proxy that merges several Jellyfin servers into one virtual Jellyfin server. \
Supports hot-reloading, catalog caching, transparent id mapping, and more."""
depends = "$auto, systemd"
section = "net"
priority = "optional"
assets = [
    ["target/release/jellyfin-merge-proxy", "/usr/bin/", "755"],
    ["config.minimal.toml", "/etc/jmp.toml", "640"],
    ["config.example.toml", "/usr/share/doc/jellyfin-merge-proxy/config.example.toml", "644"],
    ["README.md", "/usr/share/doc/jellyfin-merge-proxy/README.md", "644"],
    ["jellyfin-merge-proxy.service", "/usr/lib/systemd/system/", "644"],
]
conf-files = ["/etc/jmp.toml"]
maintainer-scripts = "debian/"

[package.metadata.deb.systemd-units]
unit-name = "jellyfin-merge-proxy"
enable = false
restart-after-upgrade = true
stop-on-upgrade = false

# RPM package metadata
[package.metadata.generate-rpm]
auto-req = "no"
# The user must exist before the files are unpacked, so that /etc/jmp.toml
# gets jmp:jmp from the package itself (no "user jmp does not exist" warning,
# and `rpm -V` stays clean).
pre_install_script = """
if ! getent passwd jmp >/dev/null 2>&1; then
    useradd --system --user-group --home-dir /var/lib/jmp --no-create-home \
            --shell /usr/sbin/nologin --comment "Jellyfin Merge Proxy" jmp
fi
"""
post_install_script = """
mkdir -p /var/lib/jmp
chown jmp:jmp /var/lib/jmp
chmod 700 /var/lib/jmp
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload || true
fi
"""
# $1 is the number of installed instances left: 0 = erase, >= 1 = upgrade.
pre_uninstall_script = """
if [ "$1" = 0 ] && [ -d /run/systemd/system ]; then
    systemctl disable --now jellyfin-merge-proxy.service || true
fi
"""
# On upgrade restart a running service with the new binary. On erase keep the
# jmp user and /var/lib/jmp: it holds secret.key, without which the enc:v1:
# values in the (kept) config cannot be decrypted.
post_uninstall_script = """
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload || true
    if [ "$1" -ge 1 ]; then
        systemctl try-restart jellyfin-merge-proxy.service || true
    fi
fi
"""
assets = [
    { source = "target/release/jellyfin-merge-proxy", dest = "/usr/bin/jellyfin-merge-proxy", mode = "755" },
    { source = "config.minimal.toml", dest = "/etc/jmp.toml", mode = "640", config = "noreplace", user = "jmp", group = "jmp" },
    { source = "config.example.toml", dest = "/usr/share/doc/jellyfin-merge-proxy/config.example.toml", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/jellyfin-merge-proxy/README.md", mode = "644" },
    { source = "jellyfin-merge-proxy.service", dest = "/usr/lib/systemd/system/jellyfin-merge-proxy.service", mode = "644" },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
