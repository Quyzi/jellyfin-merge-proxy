services:
  jellyfin-merge-proxy:
    build:
      context: .
      args:
        JMP_GIT_SHA: ${JMP_GIT_SHA:-unknown}
    image: jellyfin-merge-proxy:latest
    container_name: jellyfin-merge-proxy
    restart: unless-stopped
    ports:
      - "8096:8096"        # Jellyfin port (HTTP, or HTTPS when [tls] is set)
      # - "8080:8080"      # [tls].redirect_http_listen (HTTP -> HTTPS 308)
      # - "9090:9090"      # [metrics].listen, if metrics use a separate port
    environment:
      JMP_CONFIG: /etc/jmp.toml
      # JMP_SECRET_KEY: ""           # optional: encryption key (64 hex chars)
      # RUST_LOG: "info,jmp=debug"   # overrides [logging].filter
    volumes:
      # Config file (single-file bind mount). CREATE THE FILE FIRST on the host:
      #   touch ./jmp.toml && chmod 644 ./jmp.toml
      # Then edit with [[user]] and [[server]] entries. Must be read-write (not :ro)
      # so the proxy can rewrite secrets in place. Bind-mounted single files: atomic
      # rename fails, so secret rewriting uses safe in-place write.
      - ./jmp.toml:/etc/jmp.toml
      # Data dir: id map (ids.tsv), sessions (sessions.json), catalog cache,
      # and auto-generated secret key (secret.key). The image runs as uid 65532
      # and /var/lib/jmp is owned by 65532:65532 mode 700. For arbitrary uid
      # (e.g. `user: "99:100"` for Unraid), chown on the host first:
      #   docker run --rm -v jmp-data:/data alpine chown -R 99:100 /data
      - jmp-data:/var/lib/jmp
      # OPTIONAL TLS material (listener cert/key, client CA, upstream CAs, mTLS
      # client cert). Not needed for plain HTTP, the default. Files are watched
      # and hot-reloaded; point [tls]/[server.tls] paths here.
      # - ./certs:/config/certs:ro
      # Or e.g. certificates managed by certbot / Caddy on the host:
      # - /etc/letsencrypt/live/media.example.com:/config/certs/le:ro

  # Optional Prometheus scraping /metrics. Uncomment together with the volume below.
  # prometheus:
  #   image: cgr.dev/chainguard/prometheus:latest
  #   restart: unless-stopped
  #   command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus

volumes:
  jmp-data:

