services:
  jellyfin-merge-proxy:
    build:
      context: .
      args:
        JMP_GIT_SHA: ${JMP_GIT_SHA:-unknown}
    image: jellyfin-merge-proxy:latest
    container_name: jellyfin-merge-proxy
    restart: unless-stopped
    ports:
      - "8096:8096"        # Jellyfin port (HTTP, or HTTPS when [tls] is set)
      # - "8080:8080"      # [tls].redirect_http_listen (HTTP -> HTTPS 308)
      # - "9090:9090"      # [metrics].listen, if metrics use a separate port
    environment:
      JMP_CONFIG: /etc/jmp.toml
      # JMP_SECRET_KEY: ""           # optional: encryption key (64 hex chars)
      # RUST_LOG: "info,jmp=debug"   # overrides [logging].filter
    volumes:
      # Config file (single-file bind mount). CREATE THE FILE FIRST on the host:
      #   touch ./jmp.toml
      #   chown 65532:65532 ./jmp.toml  # make it writable by container user
      # Then edit with [[user]] and [[server]] entries. Must be read-write (not :ro)
      # so the proxy can rewrite secrets in place. Bind-mounted single files: atomic
      # rename fails, so secret rewriting uses safe in-place write.
      - ./jmp.toml:/etc/jmp.toml
      # Data dir: state database (jmp.db: id map, sessions), catalog cache,
      # and auto-generated secret key (secret.key). The image runs as uid 65532
      # and /var/lib/jmp is owned by 65532:65532 mode 700. For arbitrary uid
      # (e.g. `user: "99:100"` for Unraid), chown on the host first:
      #   docker run --rm -v jmp-data:/data alpine chown -R 99:100 /data
      - jmp-data:/var/lib/jmp
      # OPTIONAL TLS material (listener cert/key, client CA, upstream CAs, mTLS
      # client cert). Not needed for plain HTTP, the default. Files are watched
      # and hot-reloaded; point [tls]/[server.tls] paths here.
      # - ./certs:/etc/jmp/certs:ro
      # Or e.g. certificates managed by certbot / Caddy on the host:
      # - /etc/letsencrypt/live/media.example.com:/etc/jmp/certs/le:ro

  # Optional Prometheus (scrapes /metrics, evaluates deploy/prometheus/alerts.yml)
  # and Grafana (provisioned datasource + deploy/grafana-dashboard.json).
  # Remove these two services if you already run your own and import the
  # dashboard JSON there, or start only the proxy:
  #   docker compose up -d jellyfin-merge-proxy
  prometheus:
    image: prom/prometheus:latest
    container_name: jmp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - jellyfin-merge-proxy

  grafana:
    image: grafana/grafana:latest
    container_name: jmp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      # Mount only the two provider subdirectories: mounting all of provisioning/
      # hides the image's plugins/ and alerting/ dirs (errors at startup).
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # A single-file bind mount pins the file's inode: `cargo xtask dashboard`
      # rewrites it in place (Grafana reloads it within 30 s), but a git checkout
      # or an editor that replaces the file needs `docker compose restart grafana`.
      - ./deploy/grafana-dashboard.json:/etc/grafana/dashboards/jellyfin-merge-proxy.json:ro
    depends_on:
      - prometheus

volumes:
  jmp-data:
  prometheus-data:
  grafana-data:
