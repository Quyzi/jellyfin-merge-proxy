services:
  jellyfin-merge-proxy:
    build:
      context: .
      args:
        JMP_GIT_SHA: ${JMP_GIT_SHA:-unknown}
    image: jellyfin-merge-proxy:latest
    container_name: jellyfin-merge-proxy
    restart: unless-stopped
    ports:
      - "8096:8096"        # Jellyfin port (HTTP, or HTTPS when [tls] is set)
      # - "8080:8080"      # [tls].redirect_http_listen (HTTP -> HTTPS 308)
      # - "9090:9090"      # [metrics].listen, if metrics use a separate port
    environment:
      JMP_CONFIG: /config/config.toml
      # RUST_LOG: "info,jmp=debug"   # overrides [logging].filter
    volumes:
      # ./config/config.toml: copy config.example.toml (the first start writes one
      # into ./config if it is missing). Each upstream is a [[server]] block: name,
      # server = "http://host:8096", user, password (or api_key). The proxy itself
      # is [proxy]. ./config must be writable by the container user (65532 unless
      # you set `user:`), e.g.  mkdir -p config && sudo chown -R 65532:65532 config
      - ./config:/config
      # OPTIONAL TLS material (listener cert/key, client CA, upstream CAs, mTLS
      # client cert). Not needed for plain HTTP, the default. Files are watched
      # and hot-reloaded; point [tls]/[server.tls] paths here.
      # - ./certs:/config/certs:ro
      # Or e.g. certificates managed by certbot / Caddy on the host:
      # - /etc/letsencrypt/live/media.example.com:/config/certs/le:ro

  # Optional Prometheus scraping /metrics and Grafana for visualization.
  # Uncomment to enable full observability stack.
  prometheus:
    image: prom/prometheus:latest
    container_name: jmp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - jellyfin-merge-proxy

  grafana:
    image: grafana/grafana:latest
    container_name: jmp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/jellyfin-merge-proxy.json:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
