# Grafana dashboard provider. docker-compose.yml mounts deploy/grafana-dashboard.json
# (generated by `cargo xtask dashboard`) into /etc/grafana/dashboards, outside
# the provisioning tree, so this provider directory only holds provider YAML.
apiVersion: 1

providers:
  - name: jellyfin-merge-proxy
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    # The file is the source of truth: UI edits can be saved for experiments
    # but are overwritten when the file changes. Edit xtask/src/dashboard.rs.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
