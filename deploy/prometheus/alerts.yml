# Prometheus alerting rules for jellyfin-merge-proxy (loaded by deploy/prometheus.yml).
# Check with:  promtool check rules deploy/prometheus/alerts.yml
# Metric and label names are validated against the proxy by `cargo xtask check`.
groups:
  - name: jellyfin-merge-proxy
    interval: 30s
    rules:
      - alert: ProxyDown
        expr: up{job="jellyfin-merge-proxy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "jellyfin-merge-proxy {{ $labels.instance }} is not being scraped"
          description: "Prometheus could not scrape {{ $labels.instance }} for 2 minutes: the proxy is down, or the metrics listener/path/auth changed."

      - alert: UpstreamServerDown
        # Only servers in the applied config: a [[server]] removed or disabled by a
        # reload keeps its last jmp_upstream_up sample but has jmp_upstream_configured 0.
        # (Not `up * configured`: that is 0 for every removed server, i.e. "down".)
        expr: max by (instance, server) (jmp_upstream_up and on(instance, server) jmp_upstream_configured == 1) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Upstream server {{ $labels.server }} is down"
          description: "{{ $labels.server }} has been in back-off (failed health checks) for more than 2 minutes."

      - alert: NoHealthyUpstreams
        # sum(), not count(up == 1) == 0: count() of nothing is empty, not 0, so that never fired.
        expr: sum by (instance) (jmp_upstream_up and on(instance, server) jmp_upstream_configured == 1) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No healthy upstream servers on {{ $labels.instance }}"
          description: "Every configured upstream server is down or unreachable. The proxy cannot serve content."

      - alert: HighErrorRate
        expr: |
          sum by (instance) (rate(jmp_http_requests_total{status=~"5.."}[5m]))
          /
          sum by (instance) (rate(jmp_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx ratio on {{ $labels.instance }}"
          description: "More than 5% of client requests returned 5xx for 5 minutes. Current ratio: {{ $value | humanizePercentage }}"

      - alert: UpstreamHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (instance, le, server) (rate(jmp_upstream_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High upstream latency on {{ $labels.server }}"
          description: "p95 latency of upstream {{ $labels.server }} has been above 5 seconds for 10 minutes. Current p95: {{ $value | humanizeDuration }}"

      - alert: TLSCertificateExpiringSoon
        expr: (jmp_tls_cert_expiry_timestamp_seconds - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate {{ $labels.cert }} expires in under 14 days"
          description: "Certificate {{ $labels.cert }} expires in {{ $value | printf \"%.1f\" }} days. Renew it; the proxy reloads the files automatically."

      - alert: TLSCertificateExpiringVerySoon
        expr: (jmp_tls_cert_expiry_timestamp_seconds - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate {{ $labels.cert }} expires in under 7 days"
          description: "Certificate {{ $labels.cert }} expires in {{ $value | printf \"%.1f\" }} days. Renew it now."

      - alert: ConfigReloadFailed
        expr: increase(jmp_config_reloads_total{outcome="error"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Config reload failed on {{ $labels.instance }}"
          description: "The proxy rejected an edited config.toml in the last 10 minutes and kept the previous config. Check the logs."

      - alert: HighStreamDisconnectRate
        expr: |
          sum by (instance) (rate(jmp_stream_end_total{outcome="client_disconnect"}[5m]))
          /
          sum by (instance) (rate(jmp_stream_end_total[5m]))
          > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Many streams end with a client disconnect"
          description: "More than 30% of proxied streams ended with the client disconnecting for 10 minutes ({{ $value | humanizePercentage }}). Often a slow upstream or network."

      - alert: CacheHitRatioLow
        expr: |
          sum by (instance) (rate(jmp_cache_requests_total{outcome="hit"}[10m]))
          /
          sum by (instance) (rate(jmp_cache_requests_total[10m]))
          < 0.3
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Low catalog cache hit ratio"
          description: "Cache hit ratio has been below 30% for 15 minutes ({{ $value | humanizePercentage }}). Consider a longer [cache] ttl."

      - alert: CatalogIndexStale
        expr: |
          (time() - max by (instance, server) (jmp_index_last_sync_timestamp_seconds)) > 7200
          and on(instance, server) (jmp_upstream_up == 1 and on(instance, server) jmp_upstream_configured{} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Catalog index for {{ $labels.server }} is stale"
          description: "{{ $labels.server }} is up but its catalog index was last crawled more than 2 hours ago. Library queries still work but may miss new items; check the logs for index crawl errors."

      - alert: UserDataWriteFailures
        expr: increase(jmp_userdata_store_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Per-user state is not being saved"
          description: "{{ $value }} writes of per-user watch state to the database failed in the last 15 minutes. Changes are kept in memory but will be lost on restart; check disk space and permissions of the data directory."

      - alert: UserDataWriteThroughErrors
        expr: |
          sum by (instance) (rate(jmp_userdata_write_through_total{outcome="error"}[15m]))
            / sum by (instance) (rate(jmp_userdata_write_through_total[15m])) > 0.2
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Upstreams refuse user data changes"
          description: "More than 20% of watch-state changes sent to upstream copies failed for 15 minutes. The proxy's own state is correct; the servers' native clients may show outdated watch state."
      - alert: UserAccountLoginFailures
        expr: |
          sum by (instance, server) (increase(jmp_upstream_user_auth_total{outcome="failure"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A per-user upstream account cannot log in to {{ $labels.server }}"
          description: "A [[user.account]] on {{ $labels.server }} was refused (wrong or changed credentials). That proxy user's requests to the server fail until the account is fixed."
